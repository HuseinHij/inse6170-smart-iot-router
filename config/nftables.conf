#!/usr/sbin/nft -f
flush ruleset

table inet iot_router {
    set allowed_dns_hosts {
        type ipv4_addr
        elements = { 8.8.8.8, 1.1.1.1 }
    }

    chain input {
        type filter hook input priority 0;
        policy accept;
    }

    chain forward {
        type filter hook forward priority 0;
        policy accept;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
