<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="navbar">
  <span class="brand">IoT Router</span>
  <a href="/" class="{{ 'active' if request.path == '/' }}">Home</a>
  <a href="/devices" class="{{ 'active' if '/devices' in request.path }}">Devices</a>
  <a href="/alerts" class="{{ 'active' if request.path == '/alerts' }}">Alerts</a>
  <a href="/captures" class="{{ 'active' if request.path == '/captures' }}">Captures</a>
  <a href="/history" class="{{ 'active' if request.path == '/history' }}">History</a>
  <a href="/rules" class="{{ 'active' if request.path == '/rules' }}">Firewall</a>
  <span class="right">● online</span>
</div>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
