{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h2>Alerts</h2>
  <table>
    <tr>
      <th>Time</th>
      <th>Device</th>
      <th>Type</th>
      <th>Severity</th>
      <th>Message</th>
    </tr>
    {% for alert in alerts %}
    <tr>
      <td>{{ alert.created_at }}</td>
      <td>{{ alert.device_mac }}</td>
      <td>{{ alert.alert_type }}</td>
      <td>{{ alert.severity }}</td>
      <td>{{ alert.message }}</td>
    </tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
