{% extends "layout.html" %}
{% block content %}
<div class="pg-head">
  <h2>Data Rate History</h2>
</div>

<div class="panel">
  <div class="panel-head"><h3>Filter</h3></div>
  <div class="filter-bar">
    <div class="field">
      <label>Device</label>
      <select id="macSel">
        <option value="">All devices</option>
        {% for d in devices %}
        <option value="{{ d.mac_address }}" {{ 'selected' if selected_mac == d.mac_address }}>
          {{ d.device_name or d.mac_address }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Days</label>
      <input type="number" id="daysSel" value="{{ days }}" min="1" max="90" style="width:60px">
    </div>
    <button class="btn btn-blue" onclick="loadChart()">Apply</button>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Bytes/sec over time</h3><span id="info" style="font-size:12px;color:#888"></span></div>
  <div class="chart-box"><canvas id="chart" height="90"></canvas></div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Raw records</h3></div>
  <div id="tableWrap"><div class="empty">Select a filter and click Apply.</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var chartObj = null;

function loadChart() {
  var mac = document.getElementById('macSel').value;
  var days = document.getElementById('daysSel').value;
  var url = '/api/history?days=' + days + (mac ? '&mac=' + encodeURIComponent(mac) : '');

  fetch(url).then(function(r){ return r.json(); }).then(function(data) {
    document.getElementById('info').textContent = data.length + ' samples';

    var labels = data.map(function(r){ return r.recorded_at.slice(0,16); });
    var bps    = data.map(function(r){ return r.bytes_per_sec; });
    var pps    = data.map(function(r){ return r.packets_per_sec; });

    if (chartObj) chartObj.destroy();
    var ctx = document.getElementById('chart').getContext('2d');
    chartObj = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Bytes/sec', data: bps, borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.08)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true, yAxisID: 'yB' },
          { label: 'Packets/sec', data: pps, borderColor: '#e67e22', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: false, yAxisID: 'yP' }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { ticks: { maxTicksLimit: 10, font: { size: 11 } } },
          yB: { position: 'left',  title: { display: true, text: 'Bytes/sec' } },
          yP: { position: 'right', title: { display: true, text: 'Pkt/sec' }, grid: { drawOnChartArea: false } }
        }
      }
    });

    var html = '<table><thead><tr><th>Time</th><th>Device</th><th>Bytes/sec</th><th>Pkt/sec</th></tr></thead><tbody>';
    if (data.length === 0) {
      html = '<div class="empty">No data for this filter.</div>';
    } else {
      data.forEach(function(r) {
        html += '<tr><td class="mono">' + r.recorded_at.slice(0,19) + '</td><td class="mono">' + r.device_mac + '</td><td>' + r.bytes_per_sec + '</td><td>' + r.packets_per_sec + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    document.getElementById('tableWrap').innerHTML = html;
  });
}

// auto-load on page open
loadChart();
</script>
{% endblock %}
